# =============================================================================
# Jenkins da Vinheria Agnello (Parte 2)
#   cd jenkins && docker compose up -d --build
#   http://localhost:8090   usuario: admin   senha: JENKINS_ADMIN_SENHA (.env)
#
# Docker-out-of-Docker: o Jenkins usa o Docker do host via socket para
# construir e subir os containers. ATENCAO: quem controla o socket controla o
# host - aceitavel em laboratorio; em producao use agentes efemeros/isolados.
# =============================================================================
name: vinheria-jenkins

services:
  jenkins:
    build: .
    image: vinheria/jenkins:lts
    restart: unless-stopped
    ports:
      - "${JENKINS_PORTA:-8090}:8080"
    environment:
      JENKINS_ADMIN_USUARIO: ${JENKINS_ADMIN_USUARIO:-admin}
      JENKINS_ADMIN_SENHA: ${JENKINS_ADMIN_SENHA:?defina JENKINS_ADMIN_SENHA no jenkins/.env}
      JENKINS_PORTA: ${JENKINS_PORTA:-8090}
      REPO_URL: ${REPO_URL:-https://github.com/ViniciusPina/FIAP_TRABALHOS.git}
      REPO_BRANCH: ${REPO_BRANCH:-*/feat/vinheria-sprint7-infra}
    group_add:
      - "${DOCKER_GID:-0}"          # grupo dono do /var/run/docker.sock no host
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Pasta de publicacao ("IIS" simulado) visivel no host em ../publicacao
      - ../publicacao:/var/publicacao

volumes:
  jenkins-home:
    name: vinheria-jenkins-home
