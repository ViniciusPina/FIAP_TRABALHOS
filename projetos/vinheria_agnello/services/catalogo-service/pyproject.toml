[project]
name = "catalogo-service"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes | I: imports | B: bugbear | S: bandit (seguranca) | UP: pyupgrade
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["B008"]   # Depends() em parametros e o padrao do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
