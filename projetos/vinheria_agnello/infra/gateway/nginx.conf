# Vinheria Agnello - gateway (Nginx)
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;                       # nao revela versao do Nginx

    log_format json escape=json '{"ts":"$time_iso8601","cliente":"$remote_addr",'
        '"metodo":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"upstream":"$upstream_addr","rt":$request_time,'
        '"request_id":"$request_id","tls":"$ssl_protocol"}';
    access_log /dev/stdout json;

    # O DNS da rede e o BIND interno: os nomes dos servicos (registrados pelo
    # DHCP) sao resolvidos a cada 10 s - se o IP mudar, o gateway acompanha.
    resolver 10.50.0.2 valid=10s ipv6=off;
    resolver_timeout 2s;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Limite de taxa por IP (protecao basica contra abuso/DoS)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    include /etc/nginx/conf.d/*.conf;
}
