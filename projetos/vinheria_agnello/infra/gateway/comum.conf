# Rotas compartilhadas pelo gateway seguro e pelo inseguro (demo).
# Gateway -> servicos e SEMPRE HTTPS com mTLS: o gateway apresenta o proprio
# certificado e valida o certificado do servico contra a CA interna.

location = /health {
    access_log off;
    return 200 '{"status":"ok","servico":"gateway"}';
}

proxy_ssl_verify              on;
proxy_ssl_verify_depth        2;
proxy_ssl_trusted_certificate /run/pki/ca.crt;
proxy_ssl_certificate         /run/pki/tls.crt;
proxy_ssl_certificate_key     /run/pki/tls.key;
proxy_ssl_protocols           TLSv1.2 TLSv1.3;
proxy_ssl_server_name         on;
proxy_ssl_session_reuse       on;

proxy_set_header Host              $host;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
proxy_read_timeout    10s;

# Catalogo: somente leitura para o mundo externo. Reservas de estoque NAO
# passam pelo gateway - sao chamadas internas carrinho -> catalogo com JWT.
location /api/catalogo/ {
    limit_req zone=api burst=40 nodelay;
    limit_except GET { deny all; }
    set $catalogo catalogo.vinheria.local;
    proxy_ssl_name $catalogo;
    rewrite ^/api/catalogo/(.*)$ /$1 break;
    proxy_pass https://$catalogo:8443;
}

location /api/carrinho/ {
    limit_req zone=api burst=40 nodelay;
    set $carrinho carrinho.vinheria.local;
    proxy_ssl_name $carrinho;
    rewrite ^/api/carrinho/(.*)$ /$1 break;
    proxy_pass https://$carrinho:8443;
}

location / {
    return 404 '{"detail":"rota nao encontrada"}';
}
