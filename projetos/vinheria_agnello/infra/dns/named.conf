// =============================================================================
// Vinheria Agnello - DNS autoritativo interno (BIND 9)
// Zona direta  : vinheria.local
// Zona reversa : 0.50.10.in-addr.arpa (rede 10.50.0.0/24)
//
// Os registros A/PTR dos microsservicos NAO estao fixos aqui: eles sao criados
// dinamicamente pelo servidor DHCP (Kea D2) via RFC 2136 assinado com TSIG,
// exatamente como o "DNS dinamico" do Windows Server (DHCP + DNS integrados).
// =============================================================================

acl "rede-vinheria" { 10.50.0.0/24; 127.0.0.1; };

options {
    directory "/var/bind";
    pid-file  "/run/named/named.pid";

    listen-on    port 53 { any; };
    listen-on-v6 { none; };

    // Servidor apenas AUTORITATIVO: nao resolve nomes externos (evita
    // amplificacao/open resolver) e so responde para a rede interna.
    recursion no;
    allow-query    { rede-vinheria; };
    // Transferencia de zona (AXFR) somente local - usada para auditoria/evidencias
    allow-transfer { 127.0.0.1; };
    notify no;
    querylog yes;

    dnssec-validation no;
    version "nao divulgado";       // nao expor a versao do BIND
    hostname none;
    server-id none;

    // Mitiga abuso de consultas (Response Rate Limiting)
    rate-limit { responses-per-second 50; };
};

// Chave TSIG compartilhada com o Kea D2 - gerada no bootstrap (pki-init),
// nunca versionada no Git.
include "/run/named/ddns.key";

logging {
    channel stdout { stderr; severity info; print-time yes; print-category yes; };
    category default  { stdout; };
    category update   { stdout; };   // atualizacoes dinamicas vindas do DHCP
    category queries  { stdout; };   // quem consultou qual nome (evidencia)
    category lame-servers { null; };
};

zone "vinheria.local" {
    type primary;
    file "/var/bind/dyn/db.vinheria.local";
    // Somente quem possuir a chave TSIG pode registrar nomes
    update-policy { grant ddns-key zonesub ANY; };
};

zone "0.50.10.in-addr.arpa" {
    type primary;
    file "/var/bind/dyn/db.10.50.0";
    update-policy { grant ddns-key zonesub ANY; };
};
