// =============================================================================
// Vinheria Agnello - Servidor DHCPv4 (ISC Kea 2.6)
//
// Escopo 10.50.0.0/24 ("LAN de servicos"):
//   10.50.0.1          gateway da bridge Docker
//   10.50.0.2 - .15    infraestrutura com IP FIXO (DNS, DHCP, gateway)
//   10.50.0.16 - .31   faixa de bootstrap do Docker (IPAM) - nao usada pelo DHCP
//   10.50.0.100 - .109 RESERVAS (microsservicos, amarradas ao MAC)
//   10.50.0.150 - .199 POOL dinamico (estacoes/PDVs da loja)
//
// Integracao DHCP -> DNS: a cada concessao o Kea envia um pedido ao Kea D2,
// que registra A + PTR + DHCID no BIND (RFC 2136/4701) assinado com TSIG.
// =============================================================================
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "raw",
      "service-sockets-max-retries": 10,
      "service-sockets-retry-wait-time": 2000
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },

    // Permite consultar as concessoes em JSON (lease4-get-all) - usado nas evidencias
    "hooks-libraries": [
      { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" }
    ],

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },

    "expired-leases-processing": {
      "reclaim-timer-wait-time": 10,
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250
    },

    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "authoritative": true,

    // ----- DNS dinamico (equivalente ao "Atualizar dinamicamente registros DNS" do Windows Server)
    "ddns-send-updates": true,
    "ddns-override-client-update": true,
    "ddns-override-no-update": true,
    "ddns-replace-client-name": "never",
    "ddns-generated-prefix": "host",
    "ddns-qualifying-suffix": "vinheria.local.",
    "ddns-update-on-renew": true,
    "ddns-conflict-resolution-mode": "check-with-dhcid",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "",

    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "127.0.0.1",
      "server-port": 53001,
      "max-queue-size": 1024,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },

    "host-reservation-identifiers": [ "hw-address" ],

    // Opcoes entregues a TODOS os clientes: o DNS da rede e o dominio de busca
    "option-data": [
      { "name": "domain-name-servers", "data": "10.50.0.2" },
      { "name": "domain-name",         "data": "vinheria.local" },
      { "name": "domain-search",       "data": "vinheria.local" }
    ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "10.50.0.0/24",
        "interface": "eth0",
        "user-context": { "descricao": "LAN de servicos da Vinheria Agnello" },

        "pools": [ { "pool": "10.50.0.150 - 10.50.0.199" } ],

        "option-data": [
          { "name": "routers", "data": "10.50.0.1" }
        ],

        "reservations": [
          {
            "hw-address": "02:00:0a:32:00:65",
            "ip-address": "10.50.0.101",
            "hostname": "catalogo",
            "user-context": { "servico": "catalogo-service" }
          },
          {
            "hw-address": "02:00:0a:32:00:66",
            "ip-address": "10.50.0.102",
            "hostname": "carrinho",
            "user-context": { "servico": "carrinho-service" }
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          { "output": "stdout", "pattern": "%D{%Y-%m-%d %H:%M:%S.%q} %-5p [%c/%i] %m\n" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
